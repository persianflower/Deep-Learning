
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-application
  namespace: production
  labels:
    app: streamlit-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: streamlit-app

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: streamlit-app
    spec:
      containers:
      - name: streamlit-app-deployment
        image: ayeshafaquih/streamlit-docker
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
